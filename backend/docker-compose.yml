version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: precare-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: precare_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: precare-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/precare_db?schema=public"
      PORT: 5000
      GEMINI_API_KEY: "${GEMINI_API_KEY}"
      CORS_ORIGINS: "http://localhost:3000,http://localhost:5173"
    depends_on:
      - postgres

volumes:
  postgres_data:
